<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cotizador - Casa Mezcal</title>
    <!-- Favicon agregado con el nombre exacto de tu archivo -->
    <link rel="icon" href="WhatsApp Image 2026-10-12 at 6.55.07 PM.jpeg" type="image/jpeg">
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;600;700&display=swap" rel="stylesheet">
    <style>
        body {
            font-family: 'Poppins', sans-serif;
            background: linear-gradient(180deg, #103b40 0%, #06191c 100%);
            color: #e0f2fe;
            min-height: 100vh;
        }
        .card-bg {
            background-color: #0f2e33;
            border: 1px solid #1e4b52;
        }
        .room-card {
            background-color: #12373d;
            border: 2px solid #1e4b52;
            transition: all 0.2s ease-in-out;
        }
        .room-checkbox:checked + .room-card {
            border-color: #f97316;
            background-color: #18464d;
        }
        .room-badge {
            background-color: #1e4b52;
        }
        .room-checkbox:checked + .room-card .room-badge.mezcal {
            background-color: #f59e0b;
            color: #fff;
        }
        details > summary { list-style: none; }
        details > summary::-webkit-details-marker { display: none; }
        details[open] summary ~ * { animation: sweep .3s ease-in-out; }
        @keyframes sweep {
            0% {opacity: 0; margin-top: -10px}
            100% {opacity: 1; margin-top: 0px}
        }
        /* Para usar en los botones de pestañas */
        .tab-active { background-color: #f97316; color: white; font-weight: 700; box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.1); }
        .tab-inactive { background-color: transparent; color: #5eead4; font-weight: 500; }
        .tab-inactive:hover { background-color: rgba(20, 184, 166, 0.1); }
        
        .subtab-active { border-color: #14b8a6; background-color: #14b8a6; color: white; }
        .subtab-inactive { border-color: #0f766e; color: #99f6e4; }
    </style>
</head>
<body class="py-10 px-4">

    <div class="max-w-2xl mx-auto space-y-8">
        
        <!-- Header & Logo -->
        <div class="text-center space-y-4">
            <div class="inline-block rounded-full p-1 border-2 border-orange-500 bg-black/20 shadow-lg shadow-orange-500/20">
                <!-- Se usa el nombre exacto de la imagen -->
                <img src="WhatsApp%20Image%202026-10-12%20at%206.55.07%20PM.jpeg" alt="Logo Casa Mezcal" class="w-24 h-24 rounded-full object-cover">
            </div>
            <h1 class="text-3xl font-bold text-white tracking-tight">Cotiza tu estadía</h1>
            <p class="text-sm text-teal-100 max-w-md mx-auto">
                Elige el tipo de tarifa, tus habitaciones y mira un total estimado al instante.<br>
                <span class="text-xs opacity-75">Sujeto a verificación del departamento de reservas.</span>
            </p>
        </div>

        <!-- Calculadora Principal -->
        <div class="card-bg rounded-3xl p-5 sm:p-8 shadow-2xl">
            
            <!-- Selector Principal: Regular vs Festivo -->
            <div class="flex bg-[#06191c] p-1.5 rounded-xl mb-6 border border-teal-900">
                <button id="btnModoRegular" class="flex-1 py-2.5 rounded-lg tab-active transition-all text-sm sm:text-base">
                    Tarifas Regulares
                </button>
                <button id="btnModoFestivo" class="flex-1 py-2.5 rounded-lg tab-inactive transition-all text-sm sm:text-base">
                    Año Nuevo / Festivos
                </button>
            </div>

            <!-- Selector de Días (Solo visible en Tarifas Regulares) -->
            <div id="contenedorDias" class="mb-8">
                <h2 class="text-sm font-semibold text-teal-200 mb-3 text-center uppercase tracking-wider">¿Qué días nos visitas?</h2>
                <div class="flex justify-center gap-3">
                    <button id="btnDiaSemana" class="px-5 py-2 rounded-full border-2 subtab-active transition-colors text-sm font-medium">
                        Domingo a Jueves
                    </button>
                    <button id="btnDiaFinde" class="px-5 py-2 rounded-full border-2 subtab-inactive transition-colors text-sm font-medium">
                        Viernes y Sábados
                    </button>
                </div>
            </div>

            <!-- Selector de Noches -->
            <div class="mb-8">
                <h2 class="text-lg font-semibold text-white mb-4 text-center">¿Cuántas noches?</h2>
                <div class="flex justify-center gap-3">
                    <label class="cursor-pointer">
                        <input type="radio" name="noches" value="1" class="peer sr-only">
                        <div class="px-5 py-2 rounded-full border border-teal-600 text-teal-100 font-medium peer-checked:bg-teal-500 peer-checked:text-white peer-checked:border-teal-500 transition-colors">
                            1 noche
                        </div>
                    </label>
                    <label class="cursor-pointer">
                        <input type="radio" name="noches" value="2" class="peer sr-only" checked>
                        <div class="px-5 py-2 rounded-full border border-teal-600 text-teal-100 font-medium peer-checked:bg-teal-500 peer-checked:text-white peer-checked:border-teal-500 transition-colors">
                            2 noches
                        </div>
                    </label>
                    <label class="cursor-pointer">
                        <input type="radio" name="noches" value="3" class="peer sr-only">
                        <div class="px-5 py-2 rounded-full border border-teal-600 text-teal-100 font-medium peer-checked:bg-teal-500 peer-checked:text-white peer-checked:border-teal-500 transition-colors">
                            3 noches
                        </div>
                    </label>
                </div>
            </div>

            <!-- Listado de Habitaciones -->
            <div>
                <div class="flex justify-between items-end mb-4">
                    <div>
                        <h2 class="text-lg font-semibold text-white mb-1">Habitaciones</h2>
                        <p class="text-xs text-teal-200">Toca las que quieras. Precio base para 1 o 2 huéspedes.</p>
                    </div>
                </div>
                
                <div class="grid grid-cols-1 sm:grid-cols-2 gap-4" id="habitacionesContainer">
